<!doctype html>
<html lang="tl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Remote Desktop Prototype</title>
<style>
  body { font-family: system-ui, sans-serif; background: #111827; color: #e5e7eb; margin: 0; padding: 24px; }
  .wrap { max-width: 900px; margin: 0 auto; }
  .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 640px) { .cards { grid-template-columns: 1fr; } }
  .card { background: #1f2937; border-radius: 12px; padding: 20px; }
  h1 { font-size: 22px; } h2 { font-size: 16px; margin-top: 0; }
  button { background: #2563eb; color: #fff; border: 0; border-radius: 8px; padding: 10px 16px; cursor: pointer; font-size: 15px; }
  button:disabled { opacity: .5; cursor: default; }
  input { padding: 10px; border-radius: 8px; border: 1px solid #374151; background: #111827; color: #fff; font-size: 18px; width: 140px; letter-spacing: 2px; }
  .code { font-size: 36px; letter-spacing: 6px; font-weight: 700; margin: 12px 0; }
  .status { margin-top: 12px; color: #9ca3af; font-size: 14px; min-height: 20px; }
  video { width: 100%; background: #000; border-radius: 12px; margin-top: 16px; display: none; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Remote Desktop Prototype</h1>
  <div class="cards">
    <div class="card">
      <h2>Ibahagi ang screen ko (Host)</h2>
      <button id="hostBtn">Magsimula</button>
      <div class="code" id="code">------</div>
      <div class="status" id="hostStatus">Pindutin ang Magsimula para makakuha ng code.</div>
    </div>
    <div class="card">
      <h2>Kumonekta sa ibang screen (Viewer)</h2>
      <input id="joinCode" maxlength="6" placeholder="6-digit code" inputmode="numeric">
      <button id="joinBtn">Kumonekta</button>
      <div class="status" id="viewStatus"></div>
    </div>
  </div>
  <video id="video" autoplay playsinline muted></video>
</div>
<script>
const proto = location.protocol === 'https:' ? 'wss' : 'ws';
const $ = (id) => document.getElementById(id);
const rtcConfig = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

function openWs() {
  return new Promise((res) => { const ws = new WebSocket(`${proto}://${location.host}`); ws.onopen = () => res(ws); });
}

// ---------- HOST ----------
$('hostBtn').onclick = async () => {
  let stream;
  try { stream = await navigator.mediaDevices.getDisplayMedia({ video: true }); }
  catch { $('hostStatus').textContent = 'Kinansela ang screen share.'; return; }

  const ws = await openWs();
  let pc;
  ws.send(JSON.stringify({ type: 'host' }));
  stream.getVideoTracks()[0].onended = () => ws.close();

  ws.onmessage = async (e) => {
    const m = JSON.parse(e.data);
    if (m.type === 'code') {
      $('code').textContent = m.code;
      $('hostStatus').textContent = 'Naghihintay ng viewer...';
    } else if (m.type === 'viewer-joined') {
      if (!confirm('May gustong tumingin sa screen mo. Payagan?')) { ws.close(); return; }
      $('hostStatus').textContent = 'Konektado ang viewer.';
      pc = new RTCPeerConnection(rtcConfig);
      stream.getTracks().forEach((t) => pc.addTrack(t, stream));
      pc.onicecandidate = (ev) => ev.candidate && ws.send(JSON.stringify({ type: 'ice', candidate: ev.candidate }));
      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);
      ws.send(JSON.stringify({ type: 'offer', sdp: pc.localDescription }));
    } else if (m.type === 'answer') {
      await pc.setRemoteDescription(m.sdp);
    } else if (m.type === 'ice' && pc) {
      await pc.addIceCandidate(m.candidate);
    } else if (m.type === 'viewer-left') {
      $('hostStatus').textContent = 'Umalis ang viewer.';
      pc && pc.close();
    }
  };
  ws.onclose = () => {
    stream.getTracks().forEach((t) => t.stop());
    $('code').textContent = '------';
    $('hostStatus').textContent = 'Tapos na ang session.';
  };
};

// ---------- VIEWER ----------
$('joinBtn').onclick = async () => {
  const code = $('joinCode').value.trim();
  if (code.length !== 6) { $('viewStatus').textContent = 'Maglagay ng 6-digit code.'; return; }
  const ws = await openWs();
  const pc = new RTCPeerConnection(rtcConfig);
  pc.ontrack = (ev) => { $('video').srcObject = ev.streams[0]; $('video').style.display = 'block'; $('viewStatus').textContent = 'Nanonood na.'; };
  pc.onicecandidate = (ev) => ev.candidate && ws.send(JSON.stringify({ type: 'ice', candidate: ev.candidate }));
  ws.send(JSON.stringify({ type: 'join', code }));
  $('viewStatus').textContent = 'Naghihintay ng pahintulot ng host...';

  ws.onmessage = async (e) => {
    const m = JSON.parse(e.data);
    if (m.type === 'error') $('viewStatus').textContent = m.message;
    else if (m.type === 'offer') {
      await pc.setRemoteDescription(m.sdp);
      const answer = await pc.createAnswer();
      await pc.setLocalDescription(answer);
      ws.send(JSON.stringify({ type: 'answer', sdp: pc.localDescription }));
    } else if (m.type === 'ice') await pc.addIceCandidate(m.candidate);
    else if (m.type === 'ended') { $('viewStatus').textContent = 'Natapos ng host ang session.'; $('video').style.display = 'none'; }
  };
};
</script>
</body>
</html>
