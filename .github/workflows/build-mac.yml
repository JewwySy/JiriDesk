name: Build macOS installers

# Builds unsigned Apple silicon and Intel DMGs and attaches them to the release for the version in app/package.json.
on:
  workflow_dispatch:
  push:
    branches: [feature/display-settings-update-feed]
    paths: [.github/workflows/build-mac.yml]

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-14
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      # "-" signs ad hoc, which Apple silicon needs to open the app. There is no Developer ID, so it is not notarized.
      - run: npm run dist:mac -- -c.mac.identity=- --publish never
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(node -p "require('./package.json').version")"
          gh release upload "$tag" dist/*.dmg --clobber --repo "$GITHUB_REPOSITORY"
